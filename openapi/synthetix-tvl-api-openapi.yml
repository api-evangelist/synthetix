openapi: 3.2.0
info:
  title: Synthetix Tvl API
  description: Synthetix API documentation
  version: 1.0.0
servers:
- url: https://api.synthetix.io
  description: Production
tags:
- name: TVL
paths:
  /v3/tvl:
    get:
      tags:
      - TVL
      description: Returns total value locked across all Synthetix V3 deployments.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-05-23T14:00:00.000Z'
                  tvl:
                    type: number
                    example: 123456789.12345679
        '401':
          description: Unauthorized.
        '403':
          description: You have been banned by WAF.
        '429':
          description: Too many requests, you're being rate-limited.
        5XX:
          description: Service unavailable.
        default:
          description: Unexpected error.
      summary: Get tvl
      x-summary-source: derived
      operationId: getV3Tvl
      x-operation-id-source: derived
